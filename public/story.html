<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永續故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-900: #14532d;
  --green-800: #166534;
  --green-700: #15803d;
  --green-600: #16a34a;
  --green-100: #dcfce7;
  --green-50:  #f0fdf4;
  --bg:        #fafaf8;
  --text:      #1a2e1a;
  --muted:     #6b7280;
  --border:    #e5e7eb;
}

body {
  font-family: 'Noto Serif TC', 'Georgia', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, var(--green-900) 0%, var(--green-700) 60%, #2d6a4f 100%);
  padding: 24px 24px 32px;
  position: relative; overflow: hidden;
}
.header::before {
  content:''; position:absolute; inset:0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L20 25 H40 Z M18 22 L8 42 H28 Z M42 22 L32 42 H52 Z' fill='white' fill-opacity='0.04'/%3E%3C/svg%3E") repeat;
  pointer-events: none;
}
.header-inner { max-width: 720px; margin: 0 auto; position: relative; }
.header-nav { display: flex; gap: 12px; margin-bottom: 20px; }
.header-nav a {
  font-size: 0.8rem; color: rgba(255,255,255,0.75); text-decoration: none;
  padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
  font-family: 'Inter', sans-serif; transition: all 0.2s;
}
.header-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
.header-title { font-size: 1.05rem; color: rgba(255,255,255,0.65); font-family: 'Inter', sans-serif; margin-bottom: 4px; }

.container { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }

/* Loading / Error */
.status-box {
  text-align: center; padding: 80px 20px; color: var(--muted);
  font-family: 'Inter', sans-serif;
}
.status-box .icon { font-size: 2.8rem; margin-bottom: 16px; }

/* Markdown rendering */
.story-body h1 {
  font-size: 1.8rem; font-weight: 700; color: var(--green-900);
  margin-bottom: 8px; line-height: 1.3;
}
.story-body h2 {
  font-size: 1.15rem; font-weight: 700; color: var(--green-800);
  margin: 36px 0 12px; padding-bottom: 6px;
  border-bottom: 2px solid var(--green-100);
}
.story-body blockquote {
  border-left: 4px solid var(--green-500, #22c55e);
  padding: 10px 16px; margin: 16px 0;
  background: var(--green-50); border-radius: 0 8px 8px 0;
  color: var(--green-800); font-style: normal;
}
.story-body blockquote strong { font-weight: 700; }
.story-body p {
  line-height: 1.85; margin-bottom: 16px;
  font-size: 1.05rem; color: #2d3a2d;
}
.story-body table {
  width: 100%; border-collapse: collapse;
  margin: 16px 0; font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
}
.story-body th {
  background: var(--green-100); color: var(--green-900);
  padding: 8px 12px; text-align: left; font-weight: 700;
}
.story-body td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
.story-body tr:last-child td { border-bottom: none; }
.story-body hr {
  border: none; border-top: 1px solid var(--border);
  margin: 28px 0;
}
.story-body em { color: var(--muted); font-style: italic; font-size: 0.85rem; }
.story-body strong { font-weight: 700; color: var(--green-900); }

/* Share / back bar */
.action-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
}
.btn {
  padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; font-family: inherit; text-decoration: none;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--green-700); color: white; }
.btn-primary:hover { background: var(--green-800); }
.btn-outline {
  background: white; color: var(--green-800);
  border: 1.5px solid var(--green-600);
}
.btn-outline:hover { background: var(--green-50); }
.btn-muted {
  background: #f3f4f6; color: var(--muted);
  border: 1px solid var(--border);
}
.btn-muted:hover { background: var(--border); }

.copy-toast {
  display: none; font-size: 0.8rem; color: var(--green-700); font-weight: 600;
}
.copy-toast.show { display: inline; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-nav">
      <a href="/dashboard.html">← 量測記錄</a>
      <a href="/">測量系統</a>
    </div>
    <div class="header-title">永續故事</div>
  </div>
</div>

<div class="container">
  <div id="content">
    <div class="status-box">
      <div class="icon">🌱</div>
      <div>載入故事中…</div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search)
const treeId = params.get('id')

async function loadStory() {
  const el = document.getElementById('content')

  if (!treeId) {
    el.innerHTML = `<div class="status-box"><div class="icon">⚠️</div><div>缺少樹木 ID（?id=...）</div></div>`
    return
  }

  try {
    const res = await fetch(`/api/trees/${treeId}/story?format=json`)
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      el.innerHTML = `<div class="status-box"><div class="icon">🌿</div><div>${err.error || '故事尚未生成'}</div></div>`
      return
    }

    const data = await res.json()
    const html = marked.parse(data.markdown)

    const genDate = data.generatedAt
      ? new Date(data.generatedAt * 1000).toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' })
      : ''

    document.title = `永續故事｜${treeId.slice(0, 8)}`

    el.innerHTML = `
      <div class="story-body">${html}</div>
      <div class="action-bar">
        <button class="btn btn-outline" onclick="copyLink()">🔗 複製連結</button>
        <a class="btn btn-muted" href="/dashboard.html">← 返回記錄</a>
        ${genDate ? `<span style="margin-left:auto;font-size:0.8rem;color:var(--muted);font-family:'Inter',sans-serif">生成於 ${genDate}</span>` : ''}
        <span class="copy-toast" id="copy-toast">已複製！</span>
      </div>
    `
  } catch (e) {
    el.innerHTML = `<div class="status-box"><div class="icon">⚠️</div><div>載入失敗：${e.message}</div></div>`
  }
}

function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    const t = document.getElementById('copy-toast')
    if (!t) return
    t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 2000)
  })
}

loadStory()
</script>
</body>
</html>
